 {{ define "item" }}
 <li data-id="{{.ID}}" id="book-{{.ID}}">
    <div 
        class="details"
        hx-get="/books/{{.ID}}"
        hx-target="closest li"
    >
        <h3>{{.Title}}</h3>
        <p>by {{.Author}}</p>
    </div>
    <button
        hx-delete="/books/{{.ID}}" 
        hx-target="#book-{{.ID}}"
        hx-swap="outerHTML"
        hx-confirm="Are you sure?"
    >
        Delete
    </button>
</li>
{{ end }}
