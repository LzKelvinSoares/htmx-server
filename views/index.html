<!DOCTYPE html>
  <html>
    <head>
      <title>My Reading List</title>
      <script 
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" 
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" 
        crossorigin="anonymous"></script>
      <link rel="stylesheet" href="/styles.css">
    </head>
    <body>
      <header>
        <h1>My Reading List</h1>
      </header>

      <main>
        <div class="search" style="text-align: center;">
          <input 
            type="search"
            name="search"
            placeholder="Search by Title..." 
            hx-post="/books/search"
            hx-trigger="keyup changed delay:300ms"
            hx-target=".book-list"
          />
        </div>
        <div class="book-list">
            <button hx-get="/books" hx-target=".book-list">Show Books</button>
        </div>

        <div class="add-book-form">
          <h2>What do you want to read?</h2>
          <form 
            hx-post="/books"
            hx-on::after-request="document.querySelector('form').reset()"
            hx-target=".book-list ul" 
            hx-swap="beforeend"
          >
            <input 
                type="text"
                name="title"
                placeholder="Title"
                required
            />
            <input 
                type="text"
                name="author"
                placeholder="Author"
                required
            />
            <button>
                Add Book
            </button>
          </form>
        </div>
      </main>
    </body>
  </html>
